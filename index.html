<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RUAH</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #14100c;
      --bg-soft: #1c1712;
      --ink: #f2e9dc;
      --accent: #c9a876;
      --accent-soft: rgba(201,168,118,0.35);
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 60px;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.3em;
      color: var(--ink);
    }

    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
    }

    .nav-links a {
      color: rgba(242,233,220,0.55);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    .nav-links a:hover { color: var(--accent); }

    /* HERO */
    #hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo atmosférico — gradiente cálido tipo estudio */
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 80% at 50% 30%, rgba(58,46,32,0.9) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 30% 60%, rgba(60,40,20,0.5) 0%, transparent 60%),
        radial-gradient(ellipse 40% 50% at 70% 60%, rgba(45,28,18,0.4) 0%, transparent 60%),
        var(--bg);
    }

    /* Líneas decorativas laterales */
    .hero-line-left,
    .hero-line-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--accent-soft) 30%, var(--accent-soft) 70%, transparent);
      z-index: 2;
    }
    .hero-line-left  { left: 60px; }
    .hero-line-right { right: 60px; }

    /* Canvas 3D */
    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 3;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Vignette sobre el canvas */
    .hero-vignette {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(20,16,12,0.85) 100%);
    }

    /* Texto del hero — debajo de la prenda */
    .hero-text {
      position: absolute;
      z-index: 5;
      text-align: center;
      pointer-events: none;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
    }

    .hero-sub {
      font-size: 0.65rem;
      letter-spacing: 0.6em;
      text-transform: uppercase;
      color: rgba(242,233,220,0.4);
      margin-bottom: 10px;
    }

    /* Título detrás del modelo */
    .hero-title-bg {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      text-align: center;
    }

    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(9rem, 22vw, 20rem);
      letter-spacing: 0.12em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(201,168,118,0.12);
      line-height: 1;
      user-select: none;
    }

    /* Badge lateral */
    .hero-badge {
      position: absolute;
      left: 60px;
      bottom: 50%;
      transform: translateY(50%);
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .badge-line {
      width: 30px;
      height: 1px;
      background: var(--accent-soft);
    }

    .badge-text {
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(242,233,220,0.35);
      writing-mode: vertical-lr;
      transform: rotate(180deg);
      margin-top: 8px;
    }

    /* Número de edición */
    .hero-edition {
      position: absolute;
      right: 60px;
      bottom: 50%;
      transform: translateY(50%);
      z-index: 6;
      text-align: right;
    }

    .edition-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5rem;
      color: transparent;
      -webkit-text-stroke: 1px rgba(201,168,118,0.18);
      line-height: 1;
    }

    .edition-label {
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(242,233,220,0.3);
    }

    /* Scroll hint */
    .scroll-hint {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0.45;
    }

    .scroll-hint span {
      font-size: 0.58rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    .scroll-line {
      width: 1px;
      height: 44px;
      background: linear-gradient(to bottom, var(--accent), transparent);
      animation: scrollAnim 1.8s ease-in-out infinite;
    }

    @keyframes scrollAnim {
      0%   { transform: scaleY(0); transform-origin: top; }
      50%  { transform: scaleY(1); transform-origin: top; }
      51%  { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }

    /* Grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
    }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.8s ease;
    }

    #loader .l-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      letter-spacing: 0.4em;
      color: var(--ink);
    }

    .l-bar {
      width: 200px;
      height: 1px;
      background: rgba(242,233,220,0.12);
      position: relative;
      overflow: hidden;
    }

    .l-bar::after {
      content: '';
      position: absolute;
      left: -100%;
      top: 0;
      width: 100%;
      height: 100%;
      background: var(--accent);
      animation: loadBar 1.8s ease forwards;
    }

    @keyframes loadBar { to { left: 0; } }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Animación de entrada del hero */
    .hero-badge,
    .hero-edition,
    .hero-text,
    .scroll-hint {
      opacity: 0;
      animation: fadeUp 1s ease forwards;
    }
    .hero-badge    { animation-delay: 0.2s; }
    .hero-edition  { animation-delay: 0.4s; }
    .hero-text     { animation-delay: 0.6s; }
    .scroll-hint   { animation-delay: 1s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px) translateX(var(--tx, 0)); }
      to   { opacity: 1; transform: translateY(0)    translateX(var(--tx, 0)); }
    }

    .hero-text { --tx: -50%; }
    .scroll-hint { --tx: -50%; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
      "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js",
      "three/examples/jsm/loaders/DRACOLoader.js": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/DRACOLoader.js"
    }
  }
  </script>
</head>
<body>

  <div id="loader">
    <div class="l-logo">RUAH</div>
    <div class="l-bar"></div>
  </div>

  <nav>
    <div class="logo">RUAH</div>
    <ul class="nav-links">
      <li><a href="colecciones.html">Colección</a></li>
      <li><a href="carrito.html">Cotizar</a></li>
      <li><a href="#">Nosotros</a></li>
    </ul>
  </nav>

  <section id="hero">
    <!-- Fondo atmosférico -->
    <div class="hero-bg"></div>

    <!-- Líneas laterales decorativas -->
    <div class="hero-line-left"></div>
    <div class="hero-line-right"></div>

    <!-- Título gigante detrás del modelo -->
    <div class="hero-title-bg">
      <h1 class="hero-title">RUAH</h1>
    </div>

    <!-- Canvas 3D -->
    <div id="canvas-container"></div>

    <!-- Vignette encima del canvas -->
    <div class="hero-vignette"></div>

    <!-- Badge lateral izquierdo -->
    <div class="hero-badge">
      <div class="badge-line"></div>
      <span class="badge-text">Prendas Exclusivas</span>
    </div>

    <!-- Número de edición derecho -->
    <div class="hero-edition">
      <div class="edition-num">25</div>
      <div class="edition-label">Edición 2025</div>
    </div>

    <!-- Subtítulo abajo -->
    <div class="hero-text">
      <p class="hero-sub">Nueva Colección &nbsp;·&nbsp; 2025</p>
    </div>

    <!-- Scroll -->
    <div class="scroll-hint">
      <span>Scroll</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    // ─── CÁMARA más alejada para ver la prenda COMPLETA ───
    const camera = new THREE.PerspectiveCamera(
      40,
      container.clientWidth / container.clientHeight,
      0.1,
      100
    );
    camera.position.set(0, 0.05, 4.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;
    container.appendChild(renderer.domElement);

    // ─── ILUMINACIÓN CINEMATOGRÁFICA CÁLIDA ────────────────
    scene.add(new THREE.AmbientLight(0xfff1de, 0.28));

    const key = new THREE.DirectionalLight(0xfff1de, 3.5);
    key.position.set(1, 5, 4);
    scene.add(key);

    // Fill cálido (antes era azul frío 0x8aafff)
    const fill = new THREE.DirectionalLight(0xffb877, 1.1);
    fill.position.set(-4, 1, 2);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xff9955, 0.9);
    rim.position.set(0, -3, -4);
    scene.add(rim);

    const ground = new THREE.DirectionalLight(0xffe8c8, 0.4);
    ground.position.set(0, -5, 2);
    scene.add(ground);

    // ─── PARALLAX ─────────────────────────────────────────
    let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
    document.addEventListener('mousemove', (e) => {
      targetX = (e.clientX / window.innerWidth  - 0.5) * 2;
      targetY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // ─── CARGA DEL MODELO ─────────────────────────────────
    let model;
    const loader = new GLTFLoader();
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
    loader.setDRACOLoader(dracoLoader);

    loader.load(
      'camisa.glb',
      (gltf) => {
        model = gltf.scene;

        const box    = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size   = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);

        const scale  = 1.4 / maxDim;
        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));

        model.rotation.x = 0.05;

        scene.add(model);

        setTimeout(() => {
          document.getElementById('loader').classList.add('hidden');
        }, 300);
      },
      undefined,
      (err) => {
        console.error('GLB error:', err);
        document.getElementById('loader').classList.add('hidden');
      }
    );

    const clock = new THREE.Clock();

    // ─── RESIZE ────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // ─── ANIMATE ───────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      currentX += (targetX - currentX) * 0.04;
      currentY += (targetY - currentY) * 0.04;

      if (model) {
        model.rotation.y  = t * 0.25 + currentX * 0.12;
        model.position.y  = Math.sin(t * 0.7) * 0.06;
        model.rotation.x  = 0.05 + currentY * 0.06;
        model.rotation.z  = -currentX * 0.03;
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
