<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RUAH</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080808;
      color: #f0f0f0;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 60px;
      mix-blend-mode: normal;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.3em;
      color: #fff;
    }

    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
    }

    .nav-links a {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    .nav-links a:hover { color: #fff; }

    /* HERO */
    #hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .hero-text {
      position: absolute;
      z-index: 10;
      text-align: center;
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
    }

    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(8rem, 20vw, 18rem);
      letter-spacing: 0.15em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.12);
      line-height: 1;
      user-select: none;
    }

    .hero-sub {
      font-size: 0.7rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-top: 16px;
    }

    .scroll-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0.4;
    }

    .scroll-hint span {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .scroll-line {
      width: 1px;
      height: 50px;
      background: linear-gradient(to bottom, #fff, transparent);
      animation: scrollAnim 1.8s ease-in-out infinite;
    }

    @keyframes scrollAnim {
      0% { transform: scaleY(0); transform-origin: top; }
      50% { transform: scaleY(1); transform-origin: top; }
      51% { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }

    /* GRAIN overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
    }

    /* Loading screen */
    #loader {
      position: fixed;
      inset: 0;
      background: #080808;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.8s ease;
    }

    #loader .l-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      letter-spacing: 0.4em;
      color: #fff;
    }

    .l-bar {
      width: 200px;
      height: 1px;
      background: rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    .l-bar::after {
      content: '';
      position: absolute;
      left: -100%;
      top: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      animation: loadBar 1.8s ease forwards;
    }

    @keyframes loadBar {
      to { left: 0; }
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="l-logo">RUAH</div>
    <div class="l-bar"></div>
  </div>

  <nav>
    <div class="logo">RUAH</div>
    <ul class="nav-links">
      <li><a href="#">Colección</a></li>
      <li><a href="#">Cotizar</a></li>
      <li><a href="#">Nosotros</a></li>
    </ul>
  </nav>

  <section id="hero">
    <div id="canvas-container"></div>
    <div class="hero-text">
      <h1 class="hero-title">RUAH</h1>
      <p class="hero-sub">Nueva Colección 2025</p>
    </div>
    <div class="scroll-hint">
      <span>Scroll</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  // ── Minimal GLTFLoader inlined ──────────────────────────────────────────────
  // We load it from CDN via dynamic import
  </script>
  <script type="module">
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js";
    import { DRACOLoader } from "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/DRACOLoader.js";

    // Scene setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 0, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // Lighting
    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(2, 4, 3);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x8899ff, 1.0);
    fill.position.set(-3, 0, 2);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffffff, 1.5);
    rim.position.set(0, -2, -3);
    scene.add(rim);

    // Mouse parallax
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // Load GLB
    let model;
    const loader = new GLTFLoader();
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
    loader.setDRACOLoader(dracoLoader);
    loader.load('camisa.glb', (gltf) => {
      model = gltf.scene;

      // Center & scale
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 1.6 / maxDim;
      model.scale.setScalar(scale);
      model.position.sub(center.multiplyScalar(scale));

      // Slight tilt
      model.rotation.x = 0.1;

      scene.add(model);

      // Hide loader
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
      }, 200);
    },
    (xhr) => {
      // progress
    },
    (err) => {
      console.error('GLB error:', err);
      document.getElementById('loader').classList.add('hidden');
    });

    // Floating animation vars
    let clock = new THREE.Clock();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if (model) {
        // Slow Y rotation
        model.rotation.y = t * 0.4;
        // Floating up/down
        model.position.y = Math.sin(t * 0.8) * 0.08;
        // Subtle tilt with mouse
        model.rotation.x = 0.1 + mouseY * 0.08;
        model.rotation.z = -mouseX * 0.05;
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
